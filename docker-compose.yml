services:
  backend:
    build:
      context: ./backend
      target: development
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:-development-only-secret-change-me}
      DATABASE_URL: sqlite:////data/eye_care.db
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - app-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  app-data:
  frontend-node-modules:

