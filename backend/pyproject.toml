[project]
name = "eye-care-api"
version = "0.1.0"
description = "API for the Interactive Eye Care Consultation System"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<4",
    "flask-cors>=5,<7",
    "python-dotenv>=1,<2",
    "waitress>=3,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
